<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Studio Beleza Delicada</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
        <header class="navbar">
            <div class="logo">
                <i class="fa-solid fa-spa logo-icon"></i>
                <div class="logo-text"><span>Studio</span><strong>Beleza Delicada</strong></div>
            </div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="servicos.html">Serviços</a>
                <a href="profissionais.html">Profissionais</a>
                <a href="galeria.html">Galeria</a>
                <a href="contato.html">Contato</a>
                <a href="agendar.html">Agendar</a>
                <a href="cadastro.html" class="active">Cadastre-se</a>
                <a href="login.html" class="btn-admin-nav"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
            </nav>
        </header>

        <main class="registration-container">
            <!-- Abas para alternar o formulário -->
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchForm('cliente')">
                    <i class="fa-solid fa-user"></i> Cadastro de Cliente
                </button>
                <button class="tab-btn" onclick="switchForm('profissional')">
                    <i class="fa-solid fa-user-tie"></i> Cadastro de Profissional
                </button>
            </div>

            <!-- Form Cliente -->
            <form id="form-cliente" class="form-card" onsubmit="handleRegister(event, 'cliente')">
                <h2>Novo Cliente</h2>
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="cli-nome" required>
                </div>
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="cli-email" required>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp</label>
                    <input type="tel" id="cli-telef" placeholder="(11) 99999-9999" required>
                </div>
                <!-- Campo de senha adicionado de acordo com RF02 -->
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cli-senha" required>
                </div>
                <button type="submit" class="btn-primary">CADASTRAR CLIENTE</button>
            </form>

            <!-- Form Profissional -->
            <form id="form-profissional" class="form-card" style="display: none;" onsubmit="handleRegister(event, 'profissional')">
                <h2>Novo Profissional</h2>
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="prof-nome" required>
                </div>
                <div class="form-group">
                    <label>Especialidade</label>
                    <input type="text" id="prof-especialidade" placeholder="Ex: Cabeleireira, Esteticista" required>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="prof-telef" required>
                </div>
                <button type="submit" class="btn-primary">CADASTRAR PROFISSIONAL</button>
            </form>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
